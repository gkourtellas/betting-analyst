<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer smooth square with 120px radius -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Sleek Subtle Geometric Grid Lines -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.05">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>
  
  <!-- Main soccer ball graphic integrated with analytics -->
  <g transform="translate(256, 230)">
    <!-- Ball Base Circle -->
    <circle cx="0" cy="0" r="110" fill="#022c22" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)" />
    
    <!-- Soccer ball pentagons (stylized as futuristic connected nodes) -->
    <!-- Center pentagon -->
    <polygon points="0,-35 33,-11 20,28 -20,28 -33,-11" fill="url(#accentGrad)" opacity="0.9" />
    
    <!-- Outer pentagon lines & nodes -->
    <path d="M 0,-35 L 0,-110" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 33,-11 L 104,-34" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 20,28 L 65,89" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M -20,28 L -65,89" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M -33,-11 L -104,-34" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Surrounding accent nodes -->
    <circle cx="0" cy="-110" r="8" fill="#ffffff" />
    <circle cx="104" cy="-34" r="8" fill="#ffffff" />
    <circle cx="65" cy="89" r="8" fill="#ffffff" />
    <circle cx="-65" cy="89" r="8" fill="#ffffff" />
    <circle cx="-104" cy="-34" r="8" fill="#ffffff" />
  </g>

  <!-- Golden analytics upward trend line cutting across the ball -->
  <path d="M 90,380 L 190,330 L 290,240 L 420,130" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Arrow head -->
  <polygon points="420,130 380,135 415,170" fill="url(#goldGrad)" />
  
  <!-- Data points / Pulsing beacons -->
  <circle cx="90" cy="380" r="10" fill="#ffffff" />
  <circle cx="190" cy="330" r="10" fill="#ffffff" />
  <circle cx="290" cy="240" r="10" fill="#ffffff" />
  <circle cx="420" cy="130" r="10" fill="#ffffff" />
</svg>
